name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "elevatejewels-hq"
          git config user.email "elevatejewels-hq@users.noreply.github.com"
          git mv elevate-jewels-from-lovable-code.html index.html
          git commit -m "Rename elevate-jewels-from-lovable-code.html to index.html"
          git push
